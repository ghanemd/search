<!DOCTYPE html>
<html>

    <head>

        <title>Advanced Search</title>
        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <div class="link">
        <a href="index.html">Search</a>
        </div>

        <div class="google-word-advanced-search">
            <span class="first-g">G</span><span class="first-o">o</span><span class="second-o">o</span><span class="second-g">g</span><span class="letter-l">l</span><span class="letter-e">e</span>
        </div>
        <div class="advanced-search-word">
            Advanced Search
        </div>
        <hr>

        <div class="find-pages-text">
            Find Pages with ...
        </div>

        <form action="https://www.google.ca/search">     

            <div>
                <div class="label-text-container">
                    <label class="label-text">all theses words:</label>
                    <input type="text" name="as_q"><br>
                </div>
                <div class="label-text-container">
                    <label class="label-text">this exact word or phrase:</label>
                    <input type="text" name="as_epq"><br>
                </div>
                <div class="label-text-container">
                    <label class="label-text">any of these words:</label>
                    <input type="text" name="as_oq"><br>
                </div>
                <div class="label-text-container">
                    <label class="label-text">none of these words:</label>
                    <input type="text" name="as_eq">
                </div>
            </div>

            <div class="advanced-search-button-container">
                <input class="advanced-search-button" type="submit" value="Advanced Search">
            </div>

        </form>

    </body>

</html>
