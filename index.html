<!DOCTYPE html>
<html lang="en">

    <head>

        <title>Search</title>
        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <div class="link">
        <a href="image-search.html">Images</a>
        <a href="advanced-search.html">Advanced search</a>
        </div>

        <div class="google-word">
            <span class="first-g">G</span><span class="first-o">o</span><span class="second-o">o</span><span class="second-g">g</span><span class="letter-l">l</span><span class="letter-e">e</span>
        </div>


        <form class="search-form" action="https://google.com/search">
            <div class="search-bar-container">
                <input class="search-bar" type="text" name="q">
            </div>
            <input class="google-search-button" type="submit" value="Google Search">
            <input class="feeling-lucky-button" type="submit" value="I am feeling lucky" name="btnI">    
        </form>

    </body>

</html>
